name: enyakinsarj

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enyakinsarj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-enyakinsarj}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Yerel unix soketi migrate ile paylaşılır: POSTGRES_PASSWORD sonradan değişirse
      # migrate, veritabanındaki şifreyi yeni değerle eşitleyebilir (scripts/db-check.mjs).
      - pgsocket:/var/run/postgresql
    # Host'a port açılmaz; yerel geliştirmede docker-compose.override.yml 5432'yi açar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      # Bağlantı adresi uygulamada bu parçalardan kurulur ve URL kaçışlanır;
      # böylece şifredeki / @ # ? gibi karakterler adresi bozmaz.
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-enyakinsarj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enyakinsarj}
    volumes:
      - pgsocket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-En Yakın Şarj}
        NEXT_PUBLIC_SARJAG_APP_STORE_URL: ${NEXT_PUBLIC_SARJAG_APP_STORE_URL:-}
        NEXT_PUBLIC_SARJAG_PLAY_STORE_URL: ${NEXT_PUBLIC_SARJAG_PLAY_STORE_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # Bağlantı adresi uygulamada bu parçalardan kurulur ve URL kaçışlanır;
      # böylece şifredeki / @ # ? gibi karakterler adresi bozmaz.
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-enyakinsarj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enyakinsarj}
    # Host portu bağlanmaz: Coolify / Traefik gibi bir reverse proxy konteynerin 3000 portuna yönlendirir.
    # (Yerelde docker-compose.override.yml 3000'i host'a açar.)
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Zamanlanmış görevler: planlı yazıları yayınla + sosyal medyada paylaş, istasyon senkronu
  cron:
    image: alpine:3.22
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
      while true; do
        curl -fsS -m 900 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron || echo "cron isteği başarısız";
        echo;
        sleep 300;
      done'

volumes:
  pgdata:
  pgsocket:
