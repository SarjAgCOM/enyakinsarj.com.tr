name: enyakinsarj

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enyakinsarj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-enyakinsarj}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enyakinsarj}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enyakinsarj}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-En Yakın Şarj}
        NEXT_PUBLIC_SARJAG_APP_STORE_URL: ${NEXT_PUBLIC_SARJAG_APP_STORE_URL:-}
        NEXT_PUBLIC_SARJAG_PLAY_STORE_URL: ${NEXT_PUBLIC_SARJAG_PLAY_STORE_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enyakinsarj}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enyakinsarj}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Zamanlanmış görevler: planlı yazıları yayınla + sosyal medyada paylaş, istasyon senkronu
  cron:
    image: alpine:3.22
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
      while true; do
        curl -fsS -m 900 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron || echo "cron isteği başarısız";
        echo;
        sleep 300;
      done'

volumes:
  pgdata:
